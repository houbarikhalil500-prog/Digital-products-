<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة توليد المنتجات الرقمية بالذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --card-bg: #16192b;
            --primary: #7928ca;
            --secondary: #ff0080;
            --text-color: #ffffff;
            --text-gray: #a0aec0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background: #0b0d14;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: var(--primary);
        }
        .price-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(121, 40, 202, 0.1);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed var(--primary);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 20px;
            background: #0b0d14;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            display: none;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 14px;
            color: #cbd5e0;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مولد المنتجات الرقمية الفوري</h1>
        <p class="subtitle">اكتب طلبك لأي منتج رقمي (كود، قصة، خطة عمل، استراتيجية)، وسيقوم الذكاء الاصطناعي بتوليده فوراً!</p>
        
        <div class="input-group">
            <label for="promptInput">ماذا تريد أن يولد لك الموقع اليوم؟</label>
            <textarea id="promptInput" placeholder="مثال: اكتب لي خطة تسويقية لمتجر إلكتروني، أو كود بلغة بايثون لحساب الضرائب..."></textarea>
        </div>

        <div class="price-tag">
            <span>تكلفة التوليد الفوري:</span>
            <strong>3.00 USDT</strong>
        </div>

        <button class="btn" onclick="processOrder()">ادفع بالـ USDT وولد المنتج الآن</button>

        <div class="loader" id="loader">جاري محاكاة الدفع وتوليد المنتج عبر الذكاء الاصطناعي... ⏳</div>
        
        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        function processOrder() {
            const promptText = document.getElementById('promptInput').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');

            if (!promptText) {
                alert('الرجاء كتابة طلبك في الحقل المخصص أولاً!');
                return;
            }

            loader.style.display = 'block';
            resultBox.style.display = 'none';

            setTimeout(() => {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `✅ **تم تأكيد الدفع بنجاح (3 USDT)**\n\n📄 **المنتج الرقمي المُولّد بناءً على طلبك:**\n- الطلب: "${promptText}"\n\n[هنا سيظهر المحتوى الكامل أو الكود أو الملف الذي تم توليده بواسطة الـ API ويمكن للمستخدم تحميله أو نسخه فوراً].`;
            }, 3000);
        }
    </script>

</body>
</html>
